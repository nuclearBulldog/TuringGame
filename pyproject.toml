[project]
name = "turing-game"
version = "0.1.0"
description = "A short narrative platformer with turn-based mechanics about the ethical use of AI. Built with Python + pygame, playable in the browser via pygbag/WebAssembly."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
authors = [{ name = "Caleb Dellow" }]
dependencies = [
    "pygame~=2.6.1",
    "pygame-menu~=4.5.2",
]

# The game is run directly (`cd turing-game && python main.py`), not installed
# as a package, so no build backend or console-script entry point is declared.
# This file documents dependencies and centralises tool configuration.

[project.optional-dependencies]
dev = [
    "pytest~=9.0.3",
    "pytest-cov~=7.1.0",
    "pygbag~=0.9.0",
]

[project.urls]
Repository = "https://github.com/nuclearBulldog/TuringGame"

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored deps and generated web builds are not our code.
extend-exclude = ["turing-game/vendor", "turing-game/build", "turing-game/site/game"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
