name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ruff

      # Advisory for now. Once the style cleanup lands, remove the
      # `continue-on-error` line to make lint a hard gate.
      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check turing-game tests

      - name: Run tests
        run: pytest
